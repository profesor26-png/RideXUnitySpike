name: Unity iOS Spike

# Amac: Unity ile IMZASIZ .ipa uretmek.
# GameCI KULLANILMIYOR: Unity Hub 4, GameCI'nin kullandigi `--headless install`
# komutunu kaldirdi. Bu yuzden Unity CLI'yi kendimiz kuruyoruz.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unity-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: "6000.6.10f1"

jobs:
  build:
    name: Unity -> Xcode -> IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Ortam bilgisi
        run: |
          set -euxo pipefail
          sw_vers || true
          uname -m || true
          xcodebuild -version || true
          df -h / || true

      - name: En yeni Xcode'u sec
        run: |
          set -euxo pipefail
          ls -d /Applications/Xcode*.app || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          echo "secili: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Unity CLI kur
        run: |
          set -euxo pipefail
          echo "::group::Unity CLI indiriliyor"
          curl -fsSL https://unity.com/install.sh -o /tmp/unity-install.sh
          bash /tmp/unity-install.sh
          echo "::endgroup::"
          ls -la "$HOME/.local/bin" "$HOME/.unity/bin" "/usr/local/bin/unity" 2>/dev/null || true
          # shellcheck disable=SC1090
          source "$HOME/.bashrc" 2>/dev/null || true
          UNITY_CLI="$(command -v unity || true)"
          if [ -z "$UNITY_CLI" ]; then
            UNITY_CLI="$(find "$HOME" -maxdepth 6 -type f -name unity -perm -u+x 2>/dev/null | head -n1)"
          fi
          echo "CLI: $UNITY_CLI"
          test -n "$UNITY_CLI"
          echo "UNITY_CLI=$UNITY_CLI" >> "$GITHUB_ENV"
          "$UNITY_CLI" --version

      - name: Unity Editor + iOS modulu kur
        run: |
          set -euxo pipefail
          echo "::group::Editor kuruluyor: $UNITY_VERSION (ios)"
          "$UNITY_CLI" install "$UNITY_VERSION" -m ios
          echo "::endgroup::"
          ls -la /Applications/Unity/Hub/Editor/ || true
          find /Applications/Unity -maxdepth 5 -name "Unity.app" 2>/dev/null || true

      - name: Lisansi yerlestir
        run: |
          set -euxo pipefail
          printf '%s' "${UNITY_LICENSE}" > /tmp/unity.ulf
          wc -c /tmp/unity.ulf
          sudo mkdir -p "/Library/Application Support/Unity"
          sudo cp /tmp/unity.ulf "/Library/Application Support/Unity/Unity_lic.ulf"
          mkdir -p "$HOME/Library/Application Support/Unity"
          cp /tmp/unity.ulf "$HOME/Library/Application Support/Unity/Unity_lic.ulf"
          ls -la "/Library/Application Support/Unity" || true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Unity build (iOS Xcode projesi)
        run: |
          set -euxo pipefail
          UNITY_APP="$(ls -d "/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app" 2>/dev/null || find /Applications -maxdepth 6 -name "Unity.app" | head -n1)"
          echo "Unity.app: $UNITY_APP"
          test -n "$UNITY_APP"
          mkdir -p build
          "$UNITY_APP/Contents/MacOS/Unity" \
            -batchmode -quit -nographics \
            -projectPath "$PWD" \
            -executeMethod RideX.BuildScript.BuildiOS \
            -logFile - 2>&1 | tee unity-build.log

      - name: Uretilen dosyalar
        if: always()
        run: |
          set -x
          find build -maxdepth 3 -type d 2>/dev/null | sort | head -n 50 || true

      - name: Xcode derle (imzasiz)
        run: |
          set -euxo pipefail
          XCPROJ="$(find build -name "*.xcodeproj" -maxdepth 4 | head -n1)"
          echo "xcodeproj: $XCPROJ"
          test -n "$XCPROJ"
          SCHEME="$(basename "$XCPROJ" .xcodeproj)"
          echo "scheme: $SCHEME"
          xcodebuild \
            -project "$XCPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/dd \
            -resultBundlePath build/xcodebuild.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: IPA paketle
        run: |
          set -euxo pipefail
          APP="$(find build/dd -name "*.app" -maxdepth 6 | head -n1)"
          echo "app: $APP"
          test -n "$APP"
          rm -rf build/payload
          mkdir -p build/payload/Payload
          cp -R "$APP" build/payload/Payload/
          ( cd build/payload && zip -qry ../RideXSpike-unsigned.ipa Payload )
          ls -lh build/RideXSpike-unsigned.ipa

      - name: Hata detayi (annotation)
        if: failure()
        run: |
          set -x
          for f in unity-build.log xcodebuild.log; do
            [ -f "$f" ] || continue
            tail -n 45 "$f" | while IFS= read -r l; do
              l="${l//'%'/'%25'}"
              echo "::error file=$f::$l"
            done
          done

      - name: Loglari yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-logs
          path: |
            unity-build.log
            xcodebuild.log
            build/xcodebuild.xcresult
            Logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: IPA yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unity-ipa-unsigned
          path: build/RideXSpike-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
